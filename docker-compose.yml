services:
  # FastAPI Backend. The SQLite database lives in the container at /app/data,
  # which the ./backend bind mount surfaces on the host as backend/data/.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: applitrack-backend-dev
    env_file:
      - .env.local
    environment:
      # Pinned here on purpose. Compose auto-loads ./.env, which holds the
      # deployed configuration, so interpolating DATABASE_URL would risk
      # pointing local development at a remote database.
      DATABASE_URL: sqlite+aiosqlite:////app/data/applitrack.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - applitrack-network

  # Vite + TanStack Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: applitrack-frontend-dev
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - applitrack-network

networks:
  applitrack-network:
    driver: bridge
